<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">agent-rake terminal demo</title>
  <desc id="desc">A terminal showing agent-rake setting up agent files, checking generated output, and printing a compact repo summary.</desc>
  <rect width="980" height="520" rx="18" fill="#0f172a"/>
  <rect x="1" y="1" width="978" height="518" rx="17" fill="none" stroke="#24324a"/>
  <circle cx="38" cy="34" r="7" fill="#f87171"/>
  <circle cx="62" cy="34" r="7" fill="#fbbf24"/>
  <circle cx="86" cy="34" r="7" fill="#34d399"/>
  <text x="126" y="40" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="15">agent-rake demo</text>
  <g font-family="Consolas, Menlo, monospace" font-size="17">
    <text x="34" y="86" fill="#38bdf8">$ npx agent-rake --setup --target all</text>
    <text x="34" y="118" fill="#e2e8f0">config: wrote .agent-rake.json</text>
    <text x="34" y="150" fill="#e2e8f0">workflow: wrote .github/workflows/agent-rake.yml</text>
    <text x="34" y="182" fill="#e2e8f0">brief: wrote AGENTS.md, CLAUDE.md, CODEX.md, +2</text>
    <text x="34" y="228" fill="#38bdf8">$ npx agent-rake --doctor --strict --target all</text>
    <text x="34" y="260" fill="#cbd5e1">Status: no scan warnings</text>
    <text x="34" y="292" fill="#cbd5e1">[ok] Generated output: 5 generated outputs are current</text>
    <text x="34" y="338" fill="#38bdf8">$ npx agent-rake --summary</text>
    <text x="34" y="378" fill="#f8fafc">agent-rake summary for `my-app`</text>
    <text x="34" y="418" fill="#cbd5e1">Commands: `pnpm test`, `pnpm build`, `pnpm lint`, +3 more</text>
    <text x="34" y="450" fill="#cbd5e1">Risk hotspots: `auth.ts`, `db/migrations/001_users.sql`</text>
  </g>
</svg>
